spring.application.name=ksira-care-backend

# Everything is served under /api so the website can forward ksiracare.com/api/* here.
server.servlet.context-path=/api
# Hosting platforms (Render, Cloud Run) choose the port through $PORT.
server.port=${PORT:8080}

# Only the bare up/down health status, for the platform's health check: GET /api/actuator/health
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Local runs use the dev profile unless another is chosen (production sets SPRING_PROFILES_ACTIVE=prod).
spring.profiles.default=dev

# Schema is owned by Flyway (db/migration); Hibernate only checks it matches the entities.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# ── Aapta portal calendar ─────────────────────────────
# Times are stored in UTC; calendar rules (days, months, opening hours) use this zone.
ksira.portal.time-zone=Asia/Kolkata
ksira.portal.booking-window-days=60
ksira.portal.first-slot-hour=9
ksira.portal.last-slot-hour=23
# Sessions start back to back from first-slot-hour; the portal UI currently assumes one hour.
ksira.portal.session-length=PT1H
# Longest startTime–endTime range one request may ask for (covers the 60-day booking window).
ksira.portal.max-query-range=P92D
# Unmarked sessions become aapta no-shows once their day is over; checked at 5 past every hour
# (and on start-up, since the free host sleeps when idle).
ksira.portal.marking-deadline-cron=0 5 * * * *

# ── Admin console ─────────────────────────────────────────
# Admins may allocate a booking or change its BCC flag from this long before it starts until it starts.
ksira.admin.booking-action-window=PT24H
# History shows this many calendar months, counting the current one; exporting last month deletes
# older months that were already exported.
ksira.admin.history-months=2

# ── Public booking ────────────────────────────────────────
# Booking from the public website. On; KSIRA_PUBLIC_BOOKING_ENABLED=false switches it off in an
# emergency (e.g. spam) without a code change.
ksira.public-booking.enabled=${KSIRA_PUBLIC_BOOKING_ENABLED:true}
# Book at 14:00 and the first hour offered is 16:00.
ksira.public-booking.lead-time=PT2H
# Bookings one client address may make per window.
ksira.public-booking.max-per-client=5
ksira.public-booking.rate-window=PT1H

# ── Sign-in session ───────────────────────────────────────
ksira.auth.session-ttl=PT2H
# Base64-encoded, at least 256 bits. Never commit a real value; set KSIRA_AUTH_JWT_SECRET.
ksira.auth.jwt-secret=${KSIRA_AUTH_JWT_SECRET:}
# One session cookie for aaptas and admins; the token inside says which.
ksira.auth.cookie.name=ksira_session
ksira.auth.cookie.path=/api
ksira.auth.cookie.same-site=Strict
ksira.auth.cookie.secure=true
ksira.auth.login-attempts.max-failures=5
ksira.auth.login-attempts.window=PT15M
