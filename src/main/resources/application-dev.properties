# Local development: in-memory H2 (PostgreSQL mode) with demo data, reset on every start.
spring.datasource.url=jdbc:h2:mem:ksiracare;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=

# Plain http://localhost can't carry Secure cookies in every browser.
ksira.auth.cookie.secure=false

# Development-only signing key. Production must provide its own via KSIRA_AUTH_JWT_SECRET.
