# Production: PostgreSQL. All values come from the environment; startup fails if any is missing.
spring.datasource.url=${KSIRA_DB_URL}
spring.datasource.username=${KSIRA_DB_USERNAME}
spring.datasource.password=${KSIRA_DB_PASSWORD}

# API docs are for development only.
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false

# Small pool: free-tier PostgreSQL (Neon) allows few connections and suspends when idle.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=1
